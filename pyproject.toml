[project]
name = "blivedm"
version = "1.1.6"
description = "Python获取bilibili直播弹幕的库，使用WebSocket协议"
readme = "README.md"
authors = [
    { name = "bennyyip", email = "yebenmy@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "brotli>=1.2.1",
    "pure-protobuf>=3.1.5",
    "yarl>=1.25.1",
]

[project.scripts]
blivedm = "blivedm:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
